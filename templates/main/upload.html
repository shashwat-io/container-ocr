<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Container Scan</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="/static/vendor/fontawesome-6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.0/bootstrap.min.css">
    <script src="/static/vendor/tailwind-3.4.17/tailwind.js"></script>
    <script type="module" src="/static/js/inference.js?v=7"></script>
</head>
<body class="bg-gray-100">
    <div class="container-fluid py-3">
    <div class="row">
        <div class="col-md-2">
            {% include "main/sidebar.html" %}
        </div>
        <div class="col-md-10">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Container Scan Upload</h1>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Upload Images</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="file" class="block text-sm font-medium text-gray-700 mb-2">Select one or more image files</label>
                    <input type="file" id="file" name="file" accept="image/*" multiple required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="uploadButton"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Upload and Analyze
                </button>
            </form>

            <div id="progressContainer" class="mt-4 hidden">
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="progressBar" class="bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-sm mt-2">Processing: 0%</p>
            </div>

            <div id="resultContainer" class="mt-6 hidden">
                <h3 class="text-lg font-semibold mb-3">Analysis Results</h3>
                <div id="resultContent" class="space-y-4"></div>
            </div>

            <div id="errorContainer" class="mt-4 hidden">
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                    <span id="errorMessage"></span>
                </div>
            </div>
        </div>
    </div><!-- /container -->
        </div><!-- /col-md-10 -->
    </div><!-- /row -->
    </div><!-- /container-fluid -->
</body>
</html>
