<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Container OCR System{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="/static/vendor/fontawesome-6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.0/bootstrap.min.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <!-- The CSS bundle above was loaded with no matching JS anywhere in the
         app, so every data-bs-dismiss="alert" close button was inert --
         clicking it did nothing, since Bootstrap's JS is what wires that
         attribute up. -->
    <script src="/static/vendor/bootstrap-5.3.0/bootstrap.bundle.min.js"></script>
</body>
</html>
